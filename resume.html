<script>
(function () {
  var S = window.SITE, esc = window.UI.esc, P = S.profile, L = S.links;
  document.querySelectorAll("[data-resume-pdf]").forEach(function (a) { a.href = P.resumePdf; });
  function item(title, right, sub, bullets) {
    return '<div class="r-item"><div class="r-row"><strong>' + esc(title) + "</strong><span>" + esc(right || "") + "</span></div>" +
      (sub ? '<div class="r-org">' + esc(sub) + "</div>" : "") +
      (bullets && bullets.length ? "<ul>" + bullets.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul>" : "") + "</div>";
  }
  var contact = [P.location, '<a href="mailto:' + esc(P.email) + '">' + esc(P.email) + "</a>"];
  if (L.linkedin) contact.push('<a href="' + esc(L.linkedin) + '">' + esc(L.linkedin.replace(/^https?:\/\/(www\.)?/, "")) + "</a>");
  if (L.github) contact.push('<a href="' + esc(L.github) + '">' + esc(L.github.replace(/^https?:\/\//, "")) + "</a>");
  var research = S.hardware.filter(function (h) { return h.id === "obstacle-clip"; });
  var projects = ["least-privilege", "web-session-security", "comunidad-connect", "visionsim"].map(function (id) { return S.software.find(function (p) { return p.id === id; }); }).filter(Boolean);
  document.getElementById("resume").innerHTML =
    "<h1>" + esc(P.name) + "</h1>" +
    '<div class="contact-line">' + contact.map(function (c) { return "<span>" + c + "</span>"; }).join("") + "</div>" +
    '<p class="tagline">Computer Science · Cybersecurity · Robotics leadership · Community building</p>' +
    "<h2>Education</h2>" + item(P.school, P.graduation, P.degree + "; " + P.certificate + " · Atlanta, Georgia", ["Relevant coursework: " + S.education.coursework.join(", ") + "."]) +
    "<h2>Experience</h2>" + S.experience.map(function (e) { return item(e.title + " · " + e.org, e.period, null, e.bullets.slice(0, 3)); }).join("") +
    "<h2>Research</h2>" + research.map(function (r) { return item(r.title, r.date, "Math Path Summer Research Program · Georgia State University", [r.desc]); }).join("") +
    "<h2>Selected Projects</h2>" + projects.map(function (p) { return item(p.title, p.status, p.tech, [p.desc]); }).join("") +
    "<h2>Organizations</h2>" + '<p style="font-size:17px;color:var(--slate)">' + S.organizations.map(function (o) { return esc(o.name) + " (" + esc(o.role) + ")"; }).join(" · ") + "</p>" +
    "<h2>Skills</h2>" + '<dl class="r-skills">' + Object.keys(S.skills).map(function (k) { return "<dt>" + esc(k) + "</dt><dd>" + esc(S.skills[k].join(", ")) + "</dd>"; }).join("") + "</dl>";
})();
</script>
